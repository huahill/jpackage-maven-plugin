name: Release to Maven Central

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    environment: jpackage-maven-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Configure Maven settings
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>${env.CENTRAL_USERNAME}</username>
                <password>${env.CENTRAL_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Validate release version
        shell: bash
        run: |
          version="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET

          ns = {"m": "http://maven.apache.org/POM/4.1.0"}
          root = ET.parse("pom.xml").getroot()
          value = root.findtext("m:version", namespaces=ns)
          if value is None:
              raise SystemExit("Missing project version in pom.xml")
          print(value)
          PY
          )"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "Refusing to publish SNAPSHOT version: $version" >&2
            exit 1
          fi
          if [[ "$version" != "$tag" ]]; then
            echo "Tag v$tag does not match project.version $version" >&2
            exit 1
          fi

      - name: Prepare Central-compatible POM
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pom = Path("pom.xml")
          text = pom.read_text()
          text = text.replace(' xmlns="http://maven.apache.org/POM/4.1.0"', ' xmlns="http://maven.apache.org/POM/4.0.0"')
          text = text.replace("http://maven.apache.org/POM/4.1.0", "http://maven.apache.org/POM/4.0.0")
          text = text.replace("https://maven.apache.org/xsd/maven-4.1.0.xsd", "https://maven.apache.org/xsd/maven-4.0.0.xsd")
          text = text.replace("<modelVersion>4.1.0</modelVersion>", "<modelVersion>4.0.0</modelVersion>")
          text = text.replace('\n         root="true">', ">")
          pom.write_text(text)
          PY

      - name: Build and sign release artifacts
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -P release -DskipTests install -Dmaven.consumer.pom=false

      - name: Reject Maven 4 companion POMs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [
              Path.home() / ".m2/repository/io/github/huahill/jpackage-maven-plugin",
              Path("target"),
          ]
          bad = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  name = path.name
                  if "-consumer.pom" in name:
                      bad.append(str(path))
          if bad:
              print("Unexpected Maven 4 companion POM files:")
              print("\n".join(sorted(bad)))
              raise SystemExit(1)
          print("No Maven 4 companion POMs found")
          PY

      - name: Publish
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./mvnw -B -P release -DskipTests install \
            org.sonatype.central:central-publishing-maven-plugin:0.10.0:publish \
            -DautoPublish=true \
            -Dmaven.consumer.pom=false


  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --tags --force
          version="${GITHUB_REF_NAME#v}"
          tag="${GITHUB_REF_NAME}"
          notes_file="${RUNNER_TEMP}/github-release-notes.md"
          previous_tag="$(git tag --list 'v*' --sort=-version:refname | while IFS= read -r candidate; do
            if [[ "${candidate}" != "${tag}" ]]; then
              printf '%s\n' "${candidate}"
              break
            fi
          done)"

          {
            printf 'Maven Central:\n\n```xml\n<plugin>\n    <groupId>io.github.huahill</groupId>\n    <artifactId>jpackage-maven-plugin</artifactId>\n    <version>%s</version>\n</plugin>\n```\n\n' "${version}"
            printf 'https://central.sonatype.com/artifact/io.github.huahill/jpackage-maven-plugin/%s\n\n' "${version}"
            echo '## Changes'
            if [[ -n "${previous_tag}" ]]; then
              git log --no-merges --format="- %s" "${previous_tag}..${tag}"
            else
              git log --no-merges --format="- %s" "${tag}"
            fi
            echo
            echo '## Full Changelog'
            if [[ -n "${previous_tag}" ]]; then
              printf '[%s...%s](%s/%s/compare/%s...%s)\n' \
                "${previous_tag}" "${tag}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" \
                "${previous_tag}" "${tag}"
            else
              printf '[View source](%s/%s/tree/%s)\n' \
                "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${tag}"
            fi
          } > "${notes_file}"

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" \
              --title "${version}" --draft=false --prerelease=false \
              --notes-file "${notes_file}"
            exit 0
          fi

          if [[ "${version}" == *-* ]]; then
            gh release create "${tag}" --verify-tag \
              --repo "${GITHUB_REPOSITORY}" --title "${version}" --prerelease \
              --notes-file "${notes_file}"
          else
            gh release create "${tag}" --verify-tag \
              --repo "${GITHUB_REPOSITORY}" --title "${version}" \
              --notes-file "${notes_file}"
          fi

  bump-next-development-version:
    name: Bump next development version
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve next snapshot version
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$release_version"
          if [[ -z "$major" || -z "$minor" || -z "$patch" || "$patch" == *-* ]]; then
            echo "Unsupported release version for automatic bump: $release_version" >&2
            exit 1
          fi
          echo "NEXT_VERSION=$major.$minor.$((patch + 1))-SNAPSHOT" >> "$GITHUB_ENV"

      - name: Bump project version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["NEXT_VERSION"]
          pom = Path("pom.xml")
          text = pom.read_text()
          text = re.sub(r"<version>[^<]+</version>", f"<version>{version}</version>", text, count=1)
          pom.write_text(text)
          PY
          git diff -- pom.xml

      - name: Commit next development version
        shell: bash
        run: |
          if git diff --quiet -- pom.xml; then
            echo "pom.xml already uses $NEXT_VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "build: start $NEXT_VERSION"
          git push origin HEAD:main
